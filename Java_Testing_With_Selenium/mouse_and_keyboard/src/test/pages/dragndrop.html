<!DOCTYPE html>
<html>

<head>
    <style type="text/css">
        #drag,
        #drop {
            float: left;
            padding: 15px;
            margin: 15px;
            -moz-user-select: none;
        }

        #drag {
            background-color: #A9A9A9;
            height: 50px;
            width: 50px;
            border-radius: 50%;
            cursor: pointer;
            /* Makes it clear the element is
draggable */
        }

        #drop {
            background-color: #fd8166;
            height: 100px;
            width: 100px;
            border-radius: 50%;
            border: 2px dashed #000;
            /* Visual cue for drop area */
        }
    </style>
    <script type="text/javascript">
        let isDropped = false;

        function dragStart(event) {
            event.dataTransfer.setData("Text", event.target.id);
            event.dataTransfer.effectAllowed = 'move';
            var src = event.dataTransfer.getData("Text");
            var srcElement = document.getElementById(src);
            srcElement.textContent = "dragging"
            console.log("dragStart")
            return true;
        }
        function dragEnter(event) {
            var targetElement = document.getElementById(event.target.id)
            event.preventDefault();
            targetElement.style.backgroundColor='blue'
            console.log("drag enter")
            return true;
        }

        function dragOver(event) {
            event.preventDefault(); // Necessary for allowing a drop
            console.log("drag over")
            return false;
        }

        function dragDrop(event) {
            var src = event.dataTransfer.getData("Text");
            var srcElement = document.getElementById(src);
            event.target.appendChild(srcElement);
            srcElement.style.backgroundColor = 'green';
            srcElement.textContent = "Dropped!"
            console.log("dragDrop")
            // Change color upon drop
            event.stopPropagation();
            isDropped = true;
            return false;
        }

        function dragExit(event) {
            var targetElement = document.getElementById(event.target.id)
            event.preventDefault();
            targetElement.style.backgroundColor = '#fd8166'
            console.log("drag exit")
            return false;
        }

        function dragEnd(event) {
            var srcElement = document.getElementById(event.target.id);
            if (!isDropped) {
              srcElement.style.backgroundColor = '#A9A9A9';
              srcElement.textContent = "drag"
            }
            console.log("drag end")
            // Change color upon drop
            event.stopPropagation();
            return false;
        }

    </script>
</head>

<body>
    <h1>Drag and Drop</h1>
    <center>
        <div id="drop" ondragleave="return dragExit(event)" ondragenter="return dragEnter(event)" ondrop="return dragDrop(event)" ondragover="return dragOver(event)" >
            Drop here
            </div>
       <div id="drag" draggable="true" ondragstart="return dragStart(event)" ondragend="return dragEnd(event)">
            <p>Drag</p>
        </div>
        </center>
</body>

</html>
